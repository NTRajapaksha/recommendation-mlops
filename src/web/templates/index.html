<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLOps Predictor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">
        <header>
            <div class="badge">MLOPS V1</div>
            <h1>Recommendation Engine</h1>
            <p>Select a user and a movie to predict compatibility.</p>
        </header>

        <div class="control-panel">
            <div class="input-group">
                <label>User ID</label>
                <input type="number" id="userId" value="1" min="1" max="600">
            </div>

            <div class="input-group">
                <label>Select Movie</label>
                <select id="movieSelect">
                    {% for movie in movies %}
                    <option value="{{ movie.movieId }}" data-genre="{{ movie.genre_code }}">
                        {{ movie.title }} ({{ movie.genres.split('|')[0] }})
                    </option>
                    {% endfor %}
                </select>
            </div>

            <button onclick="predict()" class="analyze-btn">Run Prediction</button>
        </div>

        <div id="resultCard" class="result-card hidden">
            <div class="result-header">
                <span id="recStatus">RECOMMENDED</span>
                <span id="recScore">98% Match</span>
            </div>
            
            <div class="result-body">
                <div class="metric">
                    <span class="label">Predicted Rating</span>
                    <span class="value" id="ratingValue">4.8</span>
                </div>
                <div class="metric">
                    <span class="label">Movie ID</span>
                    <span class="value" id="movieIdDisplay">10</span>
                </div>
                <div class="metric">
                    <span class="label">User ID</span>
                    <span class="value" id="userIdDisplay">1</span>
                </div>
            </div>
        </div>

    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
